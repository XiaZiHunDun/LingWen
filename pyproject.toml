[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lingwen-novel-factory"
version = "9.11.0"
description = "灵文 · 工业化小说生产系统 — LingWen industrial novel production system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "XiaZiHunDun", email = "cuiyangjs@163.com" },
]
keywords = [
    "novel",
    "fiction",
    "writing",
    "ai-agents",
    "quality-assurance",
    "webnovel",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup",
]

# Runtime deps — 实际 import 出来的第三方包,只列需要的
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",  # minimax_provider 自定义 http client (X-Api-Key)
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "openai>=1.30",
    "anthropic>=0.30",
    "PyYAML>=6.0",
    "qdrant-client>=1.7",
    # Phase 13.0 T2 H2: FastAPI 中间件 — mutation 限流 + CORS + GZip
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
# 开发/测试依赖 — `pip install -e ".[dev]"`
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pytest-metadata>=3.1",
    "pytest-json-report>=1.5",
]

[tool.setuptools]
# 显式列包,避免 setuptools 误把 lingwen.py 当单文件模块
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
# 只声明这 3 个包,tests/ 和 lingwen.py 不进 wheel(lingwen.py 留作脚本)
include = ["infra*", "tools*", "dashboard*"]
exclude = ["tests*", "docs*", "plans*", ".claude*", ".skills*"]

[tool.setuptools.package-data]
# dashboard 有静态资源
"dashboard" = ["**/*.html", "**/*.css", "**/*.js", "**/*.json"]

# ---------------------------------------------------------------------------
# Phase 124 v16.0 — uv workspace
# ---------------------------------------------------------------------------
# 在 setuptools 之外,叠加 uv workspace 声明。新人 onboarding 用 `uv sync`
# 单命令安装所有 8 个 packages/* + apps/studio-api。
# Q1=A 决策:不保留 setuptools 兜底,若 uv 切换失败走 git revert。
[tool.uv.workspace]
members = [
    "packages/lingwen-core",
    "packages/lingwen-storage",
    "packages/lingwen-llm",
    "packages/lingwen-memory",
    "packages/lingwen-prompt",
    "packages/lingwen-pipeline",
    "packages/lingwen-quality",
    "packages/lingwen-cli",
    "packages/lingwen-shared",    # ★ v16.1 新增
    "packages/lingwen-creator",   # ★ v16.2.0 新增
    "apps/studio_api",
]

[tool.uv.sources]
# Internal workspace members (uv reads these to know they're workspace-relative)
lingwen-core = { workspace = true }
lingwen-storage = { workspace = true }
lingwen-llm = { workspace = true }
lingwen-memory = { workspace = true }
lingwen-prompt = { workspace = true }
lingwen-pipeline = { workspace = true }
lingwen-quality = { workspace = true }
lingwen-cli = { workspace = true }
lingwen-shared = { workspace = true }
lingwen-creator = { workspace = true }

# ---------------------------------------------------------------------------
# Tool configs (pyproject.toml 集中配置,避免散在多个 ini/tox)
# ---------------------------------------------------------------------------
#
# pytest 配置保留在 pytest.ini — 项目历史已用 .ini 格式,改用
# [tool.pytest.ini_options] 会引入双源(两边写不会自动同步)。
# 后续若要集中,可删 pytest.ini 把这段搬过来。

[tool.ruff]
# Ruff: 快,集 black/isort/pyflakes/flake8-bugbear 于一体
# 暂不开过严规则,只做基础 lint
line-length = 110
target-version = "py311"
extend-exclude = [
    "build",
    "dist",
    ".eggs",
    "**/__pycache__",
    ".venv",
    "venv",
    # 已归档代码不再 lint:legacy/ 目录代码冻结,只保 git 历史
    "**/legacy/**",
]

[tool.ruff.lint]
# 默认 rule set (E/F) + import sort (I) — 暂不开 complexity/security 等
select = ["E", "F", "I", "W"]
ignore = [
    "E501",  # line too long — 项目有大量中文长行,关闭
    "F401",  # imported but unused — tools/ 脚本有 re-export 模式
    "E402",  # module level import not at top of file — 项目大量用 sys.path.insert(...) + 紧随其后的 import 的合法模式
]

[tool.ruff.lint.per-file-ignores]
# tests 容许未使用 import (fixture 引入但不直接用)
"tests/**" = ["F401", "F811"]
# 集成脚本容许多 import (脚本式工具)
"tools/**" = ["F401"]

[tool.coverage.run]
source = ["infra", "tools", "dashboard"]
# Phase 11.11: legacy / API-key-only CLIs — excluded from tools module gate denominator
omit = [
    "tools/anti_trope_enhancer.py",
    "tools/claude_key_chapter_polisher.py",
    "tools/llm_emotional_resonance_checker.py",
    "tools/llm_foreshadow_analyzer.py",
    "tools/llm_pacing_analyzer.py",
    "tools/llm_quality_analyzer.py",
    "tools/logic_audit.py",
    "tools/merge_chapters.py",
    "tools/quick_check.py",
]

[tool.coverage.report]
precision = 2
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
strict_concatenate = true
follow_imports = "normal"
follow_imports_for_stubs = true
ignore_missing_imports = true
exclude = [
    "tests/.*",
    "tools/.*",
    "apps/dashboard/.*",
    ".*__pycache__.*",
]
plugins = []

# Phase 126 v16.3 — import-linter DP-01..06 enforcement.
# Permanently blocks reintroduction of:
#   - cross-layer violations between apps/studio_api ↔ packages/lingwen-creator ↔ infra
#   - file-existence check for infra/creator_*.py shims is in check_import_linter.py
#     (import-linter's `forbidden` contract requires enumerated module names; glob
#     patterns can't match Python module names that don't follow the `.` package
#     separator convention. infra.creator_X is a top-level module, not a
#     submodule of infra.creator, so `infra.creator.*` doesn't match it. The
#     file-existence check is the reliable gate for shim resurrection.)
# Run via: cd tooling/hygiene && make check  (check_import_linter.py)
[tool.importlinter]
root_packages = [
    "infra",
    "lingwen_creator",
    "apps",
]
include_external_imports = false
known_third_party_libraries = [
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "pytest",
    "click",
]
# DP-03 (v16.5 #2) — sqlite3 is a stdlib (external) module. import-linter
# requires `include_external_packages=True` on any forbidden contract that
# references external modules (not just internal `root_packages`).
# Reference: https://import-linter.readthedocs.io/en/stable/configuration.html
include_external_packages = true

# Contract 1: Layer purity between api_gateway, creator packages, and infra.
# import-linter's `layers` is ordered top → bottom. Higher layers may import
# lower layers; lower layers MUST NOT import higher ones.
#   apps.studio_api (api_gateway) may import lingwen_creator + infra.
#   lingwen_creator may import infra.
#   infra is the leaf — must NOT import from upper layers.
# This is the import-time enforcement of the layering declared in
# .lingwen/architecture.yml (top of file).
[[tool.importlinter.contracts]]
name = "layer_dependencies"
type = "layers"
layers = [
    "apps.studio_api",
    "lingwen_creator",
    "infra",
]

# Contract 2: DP-02 enforcement — business code MUST NOT import the concrete
# LLMService class. Use `from lingwen_shared.ports.llm_service import LLMServicePort`
# or `from lingwen_llm.port_adapter import LLMServiceAdapter` instead.
#
# `source_modules` restricts the contract to lingwen_creator + apps (the two
# "business code" layers per v16.3 root_packages). infra/ can self-import
# (for tests, internal use). tools/ and tests/ are outside root_packages so
# not affected.
#
# `forbidden_modules = ["infra.llm_service"]` blocks imports of the concrete
# class only. `LLMTask` and `TaskType` data types remain importable because the
# v16.4 sync facade preserves the existing API surface (full
# async-port-conformance is v16.5+ work).
[[tool.importlinter.contracts]]
name = "no_concrete_llm_service_in_business_code"
type = "forbidden"
source_modules = [
    "lingwen_creator",
    "apps",
]
forbidden_modules = [
    "infra.llm_service",
]

# Contract 3: DP-03 enforcement — business code MUST NOT import sqlite3
# directly. Use the StoragePort abstraction
# (`from lingwen_shared.ports.storage import StoragePort`) so that storage
# implementation can vary (SQLite, Postgres, in-memory test backend) without
# coupling business logic to a specific driver.
#
# Scope note: source_modules is restricted to `lingwen_creator` only (not
# `apps`). Rationale: `apps/studio_api/routes/*` is the FastAPI HTTP adapter
# and legitimately composes `infra/*` modules that use sqlite3 (e.g.,
# `infra.world_db.*`, `infra.cross_volume.storage`, `infra.reading_power.db`).
# import-linter's `forbidden` contract follows transitive imports, so any
# `apps` route that touches `infra` storage would be flagged. The DP-02
# (LLMServicePort) contract worked because port_adapter broke the chain via
# factory pattern; for storage, infra genuinely needs sqlite3, so the chain
# `apps → infra → sqlite3` is architecturally legitimate.
#
# Real enforcement is in `tests/hygiene/test_no_concrete_sqlite3_import.py`:
# - Greps apps/ + lingwen_creator/ for direct `import sqlite3` / `from sqlite3`
# - Catches the architectural violation (direct stdlib coupling) regardless
#   of import-linter's transitive limitations.
[[tool.importlinter.contracts]]
name = "no_concrete_sqlite3_in_business_code"
type = "forbidden"
source_modules = [
    "lingwen_creator",
]
forbidden_modules = [
    "sqlite3",
]

[dependency-groups]
dev = [
    "grimp>=3.15",
    "import-linter>=2.13",
]
