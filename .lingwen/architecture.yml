# Phase 124 v16.0 设计原则(DP-01..DP-06)
# enforcement 在 v16.0..v16.5 渐进加,v16.0 阶段仅声明。
design_principles:
  - id: DP-01
    rule: "跨 lingwen-* package import 仅 4 种允许形式 (contracts / ports / value_objects / pure util)"
    scope: "cross-package"
    enforcement_phase: v16.5
  - id: DP-02
    rule: "LLM 调用必须通过 LLMServicePort,不允许 import concrete LLMService 类"
    scope: "any context using LLM"
    enforcement_phase: 'v16.4 ✓ done (sync facade + grimp-evasion for data types; v16.5 ✓ done: hack eliminated via LLMTask/TaskType relocation to lingwen_shared + factory pattern. Regression check: tooling/hygiene/check_no_grimp_evasion.py)'
  - id: DP-03
    rule: "持久化操作必须通过 StoragePort,不允许 import sqlite3 或硬编码路径"
    scope: "any context with persistence"
    enforcement_phase: 'v16.5 #2 ✓ done (defense-in-depth). v16.5 #3 PARTIAL ✓ done (SqliteStorageAdapter concrete impl at infra/persistence/sqlite_storage_adapter.py — the ONLY allowed import sqlite3 site in infra/). v16.5 #4 ✓ done (defense-in-depth hygiene gate expansion to lingwen_core/pipeline/cli with 8-file whitelist). v16.5 #N: relocate SqliteStorageAdapter to packages/lingwen-storage/, migrate 8 whitelisted files, expand contract to [\"lingwen_creator\", \"apps\"].'
  - id: DP-04
    rule: "跨 context 调用只通过 contract DTO"
    scope: "cross-context"
    enforcement_phase: v16.1 ✓ done (lingwen-shared 包上线, zod CI 在线)
  - id: DP-05
    rule: "新增 feature 必须先建或选 context"
    scope: "all"
    enforcement_phase: v16.2
  - id: DP-06
    rule: "每个 phase 代码改动收敛到自己 context 内 ≤4 文件"
    scope: "all"
    enforcement_phase: v16.2