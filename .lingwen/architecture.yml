# LingWen 架构契约 — AI 可读的结构化模块边界定义
# 此文件是 AGENTS.md 的机器可读版本，AI 开发工具应优先解析此文件

version: "25.0"  # Phase 25 — SSE Batch 增强 Filter/Replay/Auth: SSE 事件流服务端 event_types 过滤 + 连接时磁盘 replay + 读取门控. 1 NEW invariant (#50 SSE 事件流支持服务端 event_types 过滤 + 连接时磁盘 replay; 读取被 LINGWEN_ALLOW_DASHBOARD_BATCH 门控). Phase 24 — SSE Real-time Batch Progress feature phase: replaces Phase 23 3s scraping polling with server-push real-time progress. Backend: NEW infra/studio_batch_streamer.py (BatchEventPublisher module-level thread-safe singleton with per-job subscriber list + asyncio.Queue cap 100 drop-oldest + BatchEventStreamer) + GET /api/studio/batch/<job_id>/events SSE route (StreamingResponse, Cache-Control no-cache, X-Accel-Buffering no, 15s heartbeat, non-streaming 404/401/403) + 6 named events (job_state/chapter_started/chapter_completed/job_completed/job_failed/job_cancelled) + 4 hooks in infra/studio_batch_runner.py (start/poll-completed/cancel/chapter_records). Frontend: NEW useBatchEventStream composable (native EventSource, 50-event FIFO buffer, addEventListener per named event) + usePilotBatch drops 3s polling for SSE (processedEventIndex consume-each-once + 5s fallback polling ONLY when SSE disconnected) + PilotLivePanel chapterEvents prop renders recent 5. 1 NEW architecture invariant (#49 SSE推 batch 状态为 canonical; Phase 23 3s polling dropped, 5s fallback ONLY when SSE disconnected).

# 模块分层（单向依赖：上层可依赖下层，下层禁止依赖上层）
layers:
  - name: presentation
    path: apps/dashboard/src/
    depends_on: [api_gateway]
    tech: [Vue3, Pinia, TypeScript]
  - name: api_gateway
    path: apps/studio_api/
    depends_on: [core]
    tech: [FastAPI, Pydantic, WebSocket]
  - name: core
    path: infra/
    depends_on: []
    tech: [Python3.12, SQLite]

# 架构不变量（违反即架构错误）
invariants:
  - id: I001
    rule: "infra/ 禁止 import apps/"
    severity: error
  - id: I002
    rule: "检查器 = 纯函数规则引擎，禁止调用 LLM / AI 服务"
    severity: error
    scope: "infra/quality/checkers/, infra/cross_volume/"
  - id: I003
    rule: "L3 (consistency / quality) 和 L4 (cross_volume) 禁止 import L2 (creator / agent)"
    severity: error
  - id: I004
    rule: "审查流程使用独立 AI 会话，审查者无作者 CLAIM 访问"
    severity: error
  - id: I005
    rule: "创作流必须支持 checkpoint 恢复，不可中断"
    severity: error
  - id: I048
    rule: "PilotPage owns batch lifecycle surface; StudioPage MUST NOT host embedded Pilot start/preflight/job panel"
    severity: error
    scope: "apps/dashboard/src/pages/StudioPage.vue"

