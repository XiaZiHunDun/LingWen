# Phase 124 v16.0 设计原则(DP-01..DP-06)
# enforcement 在 v16.0..v16.5 渐进加,v16.0 阶段仅声明。
design_principles:
  - id: DP-01
    rule: "跨 lingwen-* package import 仅 4 种允许形式 (contracts / ports / value_objects / pure util)"
    scope: "cross-package"
    enforcement_phase: v16.5
  - id: DP-02
    rule: "LLM 调用必须通过 LLMServicePort,不允许 import concrete LLMService 类"
    scope: "any context using LLM"
    enforcement_phase: 'v16.4 ✓ done (sync facade + grimp-evasion for data types). v16.5 #1 ✓ done (hack eliminated via LLMTask/TaskType relocation to lingwen_shared + factory pattern). v16.5 #6 ✓ done (defense-in-depth hygiene gate expanded to tools/ with 12-file whitelist). v16.5 #N.6 ✓ done (12 whitelisted tools/ files migrated to LLMServiceAdapter; whitelist retired; zero direct infra.llm_service imports in tools/). v16.5 #N.12 ✓ done (async execute/execute_stream via asyncio.to_thread). Future: nothing — production-grade.'
  - id: DP-03
    rule: "持久化操作必须通过 StoragePort,不允许 import sqlite3 或硬编码路径"
    scope: "any context with persistence"
    enforcement_phase: 'v16.5 #2 ✓ done (defense-in-depth). v16.5 #3 PARTIAL ✓ done (SqliteStorageAdapter concrete impl). v16.5 #4 ✓ done (defense-in-depth hygiene gate). v16.5 #N.0 ✓ done (relocated to packages/lingwen-storage/, back-compat shim). v16.5 #N.1 ✓ done (factory pattern in lingwen_shared). v16.5 #N.3 ✓ done (8 whitelisted files migrated). v16.5 #N.4 ✓ done (21 remaining infra/* files migrated to SqliteStorageAdapter: world_db queries + persistence internals + cross_volume + event_sourcing + reading_power + tools/workflow/lib + migrate_to_sqlite; infra/ sqlite3 import count 22→2 — only exception class identities IntegrityError + Error remain). Future: nothing — production-grade.'
  - id: DP-04
    rule: "跨 context 调用只通过 contract DTO"
    scope: "cross-context"
    enforcement_phase: v16.1 ✓ done (lingwen-shared 包上线, zod CI 在线)
  - id: DP-05
    rule: "新增 feature 必须先建或选 context"
    scope: "all"
    enforcement_phase: v16.2
  - id: DP-06
    rule: "每个 phase 代码改动收敛到自己 context 内 ≤4 文件"
    scope: "all"
    enforcement_phase: v16.2
