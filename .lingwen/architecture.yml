# LingWen 架构契约 — AI 可读的结构化模块边界定义
# 此文件是 AGENTS.md 的机器可读版本，AI 开发工具应优先解析此文件

version: "16.0.0"  # Phase 124 v16.0 闭环

# 模块分层（单向依赖：上层可依赖下层，下层禁止依赖上层）
layers:
  - name: presentation
    path: apps/dashboard/src/
    depends_on: [api_gateway]
    tech: [Vue3, Pinia, TypeScript]
  - name: api_gateway
    path: apps/studio_api/
    depends_on: [core]
    tech: [FastAPI, Pydantic, WebSocket]
  - name: core
    path: infra/
    depends_on: []
    tech: [Python3.12, SQLite]

# 架构不变量（违反即架构错误）
invariants:
  - id: I001
    rule: "infra/ 禁止 import apps/"
    severity: error
  - id: I002
    rule: "检查器 = 纯函数规则引擎，禁止调用 LLM / AI 服务"
    severity: error
    scope: "infra/quality/checkers/, infra/cross_volume/"
  - id: I003
    rule: "L3 (consistency / quality) 和 L4 (cross_volume) 禁止 import L2 (creator / agent)"
    severity: error
  - id: I004
    rule: "审查流程使用独立 AI 会话，审查者无作者 CLAIM 访问"
    severity: error
  - id: I005
    rule: "创作流必须支持 checkpoint 恢复，不可中断"
    severity: error

# 模块边界（明确每个模块的公共 API 和依赖）
module_boundaries:
  quality:
    path: infra/quality/
    exports: [QualityChecker, QualityRepairer, Severity]
    allowed_imports: [infra/errors]
    forbidden_imports: [infra/creator, infra/ai_service]
  creator:
    path: infra/creator/
    exports: [CreatorAgent, CreatorBatchHistory, CreatorMemory]
    allowed_imports: [infra/quality, infra/ai_service, infra/errors, infra/persistence]
  cross_volume:
    path: infra/cross_volume/
    exports: [Ripple, RippleStorage, ReferenceGraph]
    allowed_imports: [infra/errors]
    forbidden_imports: [infra/creator]
  hooks:
    path: infra/hooks/
    exports: [HookEngine, EventBus]
    allowed_imports: [infra/errors]
  persistence:
    path: infra/persistence/
    exports: [Registry, WriteChapter, Connection]
    allowed_imports: [infra/errors]
  ai_service:
    path: infra/ai_service/
    exports: [Provider, Router]
    allowed_imports: [infra/errors]
  world_db:
    purpose: "Characters, factions, lore, timeline, proposals (SQLite)"
    exports: ["init_schema", "get_connection", "queries.*", "markdown_roundtrip.*", "agent_extractors.extract_proposals_from_chapters"]
    consumers: ["apps.studio_api.routes.world"]
  llm_benchmarks:
    purpose: "Phase 120 LLM provider benchmark tool (dev/CI only, NOT production code path)"
    path: infra/llm_benchmarks/
    exports: ["run_benchmark", "get_provider_llm", "MockLLMService", "CallResult", "ProviderMetrics", "compute_metrics", "consistency_score", "quality_composite", "recommend_priority"]
    consumers: ["(manual CLI only; benchmark results gitignored under infra/llm_benchmarks/results/)"]
    notes:
      - "Bypasses infra.llm_service.LLMService (plugin_manager discovery is broken)"
      - "Direct instantiation via lingwen_llm.providers.get_provider_class"

# 当前活跃子系统（v15.0 闭环 → v16.0 闭环）
active_subsystems:
  write_workspace:
    path: apps/dashboard/src/components/writeWorkspace/
    status: shipped
    spec: docs/superpowers/specs/2026-08-26-immersive-write-workspace-design.md
    plan: docs/superpowers/plans/2026-08-26-immersive-write-workspace.md
  v16_target_architecture:
    purpose: "Phase 124 v16.0 目标架构 — DDD 风格 Vertical Slice + 轻量 Hexagonal"
    status: shipped
    spec: docs/superpowers/specs/2026-08-27-phase-124-target-architecture-design.md
    plan: docs/superpowers/plans/2026-08-27-phase-124-v16-0-plan.md
    implementation_log: docs/superpowers/handoffs/2026-08-27-phase-124-v16-0-handoff.md
    notes:
      - "v16.0 完成: uv workspaces + turbo + import-linter 骨架 + dead dir 清理"
      - "v16.0 不动业务代码;bounded context 拆分(v16.2/v16.3) / port 强制(v16.4/v16.5) 后续"

# Phase 124 v16.0 设计原则(DP-01..DP-06)
# enforcement 在 v16.0..v16.5 渐进加,v16.0 阶段仅声明。
design_principles:
  - id: DP-01
    rule: "跨 lingwen-* package import 仅 4 种允许形式 (contracts / ports / value_objects / pure util)"
    scope: "cross-package"
    enforcement_phase: v16.5
  - id: DP-02
    rule: "LLM 调用必须通过 LLMServicePort,不允许 import concrete LLMService 类"
    scope: "any context using LLM"
    enforcement_phase: v16.4
  - id: DP-03
    rule: "持久化操作必须通过 StoragePort,不允许 import sqlite3 或硬编码路径"
    scope: "any context with persistence"
    enforcement_phase: v16.5
  - id: DP-04
    rule: "跨 context 调用只通过 contract DTO"
    scope: "cross-context"
    enforcement_phase: v16.1
  - id: DP-05
    rule: "新增 feature 必须先建或选 context"
    scope: "all"
    enforcement_phase: v16.2
  - id: DP-06
    rule: "每个 phase 代码改动收敛到自己 context 内 ≤4 文件"
    scope: "all"
    enforcement_phase: v16.2