name: Repo hygiene

# Limit token permissions: this workflow only reads source and runs a
# local script. No write operations are needed.
permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  file-size-guard:
    name: File size guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: File size guard
        run: python3 tooling/hygiene/check_file_size.py

      - name: Brand consistency
        run: python3 tooling/hygiene/check_brand_consistency.py
