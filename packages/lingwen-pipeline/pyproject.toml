[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lingwen-pipeline"
version = "0.1.0"
description = "LingWen · 状态/钩子/状态机 + 主编排"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "lingwen-core",
    "lingwen-llm",
    "lingwen-prompt",
    "lingwen-storage",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/lingwen_pipeline"]