[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lingwen-prose-snapshot"
version = "0.1.0"
description = "LingWen canonical prose_snapshot package (Phase 51 P3-ARCHDEBT prose cluster closure)"
requires-python = ">=3.11"
dependencies = [
    "lingwen-prose-calibration",  # build_prose_heatmap + is_prose_issue + load_prose_config (Phase 44)
]
# NOT-LEAF — 1 workspace dep. Provides 8 public symbols
# (2 consts + 6 funcs) in a single sub-module snapshot.py.

[tool.hatch.build.targets.wheel]
packages = ["src/lingwen_prose_snapshot"]
