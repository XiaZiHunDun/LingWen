[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lingwen-world-model"
version = "0.1.0"
description = "LingWen · World Model (Ripple + Subplot + Snapshot behavior engine — RippleEngine, KeyPointGraph, SnapshotStore, lifecycle, queries, registry, snapshot_diff, links, subplot_helpers)"
requires-python = ">=3.12"
dependencies = [
    "lingwen-core",  # canonical domain entities (WorldSnapshot, Ripple, Plot, etc.) + use-cases
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/lingwen_world_model"]
include = ["src/lingwen_world_model/**/*.py"]  # explicit (default but documented)
