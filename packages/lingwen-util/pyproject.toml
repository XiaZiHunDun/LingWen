[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lingwen-util"
version = "0.1.0"
description = "LingWen canonical util module (Phase 82 P3-ARCHDEBT util)"
requires-python = ">=3.11"
dependencies = [
    "lingwen-errors",  # Phase 36 — for error classes (NetworkError/TimeoutError/ServiceUnavailableError/etc.) + is_instance helper
]
# NOT-LEAF — 1 workspace dep: lingwen-errors

[tool.hatch.build.targets.wheel]
packages = ["src/lingwen_util"]