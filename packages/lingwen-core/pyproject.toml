[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lingwen-core"
version = "0.1.0"
description = "LingWen · 5 核心 Agent + 角色池"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "lingwen-storage",
    "lingwen-pipeline",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/lingwen_core"]
