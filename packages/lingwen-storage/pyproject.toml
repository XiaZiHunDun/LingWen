[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lingwen-storage"
version = "0.1.0"
description = "LingWen · 事件流与文件存储"
requires-python = ">=3.12"
dependencies = [
    "python-ulid>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/lingwen_storage"]
